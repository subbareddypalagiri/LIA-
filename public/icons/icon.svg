<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Luxury Outer Gold Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>

  <!-- Barbell Graphic -->
  <g filter="url(#goldGlow)">
    <!-- Shaft -->
    <rect x="146" y="180" width="220" height="16" rx="8" fill="url(#goldGrad)"/>
    
    <!-- Left Weight Plates -->
    <rect x="126" y="145" width="16" height="86" rx="5" fill="url(#goldGrad)"/>
    <rect x="104" y="157" width="18" height="62" rx="4" fill="#f59e0b"/>
    <rect x="88" y="167" width="12" height="42" rx="3" fill="#b45309"/>

    <!-- Right Weight Plates -->
    <rect x="370" y="145" width="16" height="86" rx="5" fill="url(#goldGrad)"/>
    <rect x="390" y="157" width="18" height="62" rx="4" fill="#f59e0b"/>
    <rect x="412" y="167" width="12" height="42" rx="3" fill="#b45309"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oswald', sans-serif" font-size="118" font-weight="900" fill="#ffffff" letter-spacing="8">LIA</text>
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#f59e0b" letter-spacing="14">IRON CLUB</text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="6">ELITE PHYSIQUE</text>
</svg>
